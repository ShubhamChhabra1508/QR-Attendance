
{% extends "base.html" %}
{% block title %}Login | QR Attendance{% endblock %}
{% block content %}
<div style="max-width: 440px; margin: 40px auto 20px;">
  <div class="panel form-card">
    <h2 style="margin-top: 0;">Sign In</h2>
    <p style="margin-top: -6px; margin-bottom: 20px;">Enter your credentials to access the system.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label for="username">Username</label>
        <input id="username" name="username" placeholder="e.g. admin or student1" required autocomplete="username">
      </div>
      
<label for="password">Password</label>

<div class="password-field">
    <input
        id="password"
        type="password"
        name="password"
        placeholder="••••••••"
        required
        autocomplete="current-password"
    >

    <button
        type="button"
        id="togglePassword"
        class="toggle-password"
        aria-label="Show password"
        aria-pressed="false"
        style="position:absolute; right:10px; top:50%; transform:translateY(-50%); border:none; background:transparent; cursor:pointer;"
    >
        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg"
             width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>
    </button>
</div>

      <button type="submit" style="width: 100%; margin-top: 6px;">Sign in</button>
    </form>
  </div>
</div>

<script>
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");
const eyeIcon = document.getElementById("eyeIcon");

togglePassword.addEventListener("click", function () {
    const showPassword = passwordInput.type === "password";

    passwordInput.type = showPassword ? "text" : "password";

    togglePassword.setAttribute(
        "aria-label",
        showPassword ? "Hide password" : "Show password"
    );

    togglePassword.setAttribute(
        "aria-pressed",
        String(showPassword)
    );

    eyeIcon.innerHTML = showPassword
        ? '<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 002.8 2.8"/><path d="M9.9 5.2A11 11 0 0112 5c6.5 0 10 7 10 7s-3.5 7-10 7c-1 0-2-.2-2.8-.5"/>'
        : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>';
});
</script>

{% endblock %}
